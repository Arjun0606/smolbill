{{define "styles"}}<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#272b35; --fg:#e6e8ec; --mut:#9aa3b2; --accent:#4ad295; --warn:#e5484d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .wrap { max-width:920px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:28px 0 10px; }
  .sub { color:var(--mut); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
  td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .big { font-size:28px; font-weight:700; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; }
  .ok { background:rgba(74,210,149,.15); color:var(--accent); }
  .bad { background:rgba(229,72,77,.15); color:var(--warn); }
  .mut { color:var(--mut); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  .foot { margin-top:40px; color:var(--mut); font-size:13px; text-align:center; }
  .diff { color:var(--warn); font-size:13px; }
</style>{{end}}
