{{define "styles"}}<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap');
  /* Amber Noir — dark, sharp, honey-amber. Matches the smolbill design system. */
  :root { --bg:#0A0A0A; --card:#161616; --line:#262626; --fg:#FAFAFA; --mut:#8E8E8E; --accent:#F5A623; --warn:#E5544B; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--mut);
    font:15px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .wrap { max-width:920px; margin:0 auto; padding:40px 24px 80px; }
  h1 { font-family:"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:28px; letter-spacing:-.02em; color:var(--fg); margin:0 0 6px; }
  h2 { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--mut); margin:32px 0 12px; }
  .sub { color:var(--mut); margin:0 0 28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:0; padding:20px 22px; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-family:"JetBrains Mono",ui-monospace,monospace; }
  td { color:var(--fg); }
  td.num,th.num { text-align:right; font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .big { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:30px; font-weight:700; color:var(--fg); letter-spacing:-.02em; }
  .pill { display:inline-block; padding:3px 10px; border:1px solid var(--line); border-radius:0; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:12px; font-weight:700; letter-spacing:.02em; }
  .ok { color:var(--accent); border-color:rgba(245,166,35,.45); }
  .bad { color:var(--warn); border-color:rgba(229,84,75,.45); }
  .mut { color:var(--mut); }
  .mono { font-family:"JetBrains Mono",ui-monospace,monospace; font-size:13px; }
  .foot { margin-top:48px; color:var(--mut); font-size:13px; text-align:center; }
  .diff { color:var(--warn); font-size:13px; }
</style>{{end}}
