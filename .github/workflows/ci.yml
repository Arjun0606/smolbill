name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The Postgres integration tests run when SMOLBILL_TEST_DATABASE_URL is set.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smolbill
          POSTGRES_PASSWORD: smolbill
          POSTGRES_DB: smolbill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smolbill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SMOLBILL_TEST_DATABASE_URL: postgres://smolbill:smolbill@localhost:5432/smolbill?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'run gofmt -w .' && exit 1)

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race)
        run: go test -race -count=1 ./...
